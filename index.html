<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover for safe areas; max-scale 1 stops pinch and double-tap zoom in a standalone app -->
    <!-- Content Security Policy: filled in by cspPlugin in vite.config.ts at build time (removed in dev). -->
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2e34" />
    <meta name="color-scheme" content="dark" />
    <!-- Graphite from the very first paint, before the CSS bundle loads (critic B5: no white flash). -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        background: linear-gradient(to bottom, #2b2e34, #0f1114 60%) #0f1114;
      }
    </style>
    <meta name="description" content="Your training keeps working in any gym." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnyGym" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>AnyGym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
