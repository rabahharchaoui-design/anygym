name: Check and deploy to GitHub Pages

# Every push to master and to a session branch (s3-plans, s4-run, ...) runs the check job. Only master
# (a push or a manual run on master) goes on to build and deploy, and only when the check passed, so a broken master
# cannot ship. The build and the deployed artifact are the same as before the gate.
on:
  push:
    branches: [master, 's*-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # A newer push to a session branch replaces the check still running for it. Master always finishes.
    concurrency:
      # A manual run (workflow_dispatch) gets its own group, so several can run side by side (PLAN 3.6u: ten in a row).
      group: check-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    env:
      # Only the iPhone 15 profile runs here, so only WebKit is installed.
      PW_NO_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci wipes node_modules, so it only runs when the lock file changed.
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run typecheck
      # Structure rules: files over 400 lines may not grow, screens do not import src/db directly.
      - run: npm run lint
      - run: npm test
      # Type check, production build, and the secret scan of every tracked file and of dist/.
      - run: npm run build
      - run: npm run perf:bundle
      # Files over 400 lines may only get smaller; a new one over 400 fails (also part of the build above).
      - run: npm run size
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      # The browser files are cached, the system libraries it needs are not.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      # The golden journeys: the app as a person uses it, WebKit, iPhone 15, no retries.
      - run: npm run test:golden
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: check
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
